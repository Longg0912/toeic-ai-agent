[alembic]

# Alembic migration scripts
script_location = %(here)s/backend/alembic

# Project root for Python imports
prepend_sys_path = %(here)s

# Path separator for recent Alembic versions
path_separator = os

# Database URL is intentionally not stored here.
# It is loaded from backend.app.db.session in env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S